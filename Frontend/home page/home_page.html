<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Home Page</title>
    <link rel="stylesheet" href="home_style.css">
</head>

<body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="profile-info">
            <div class="profile-pic">
                <i class="fa-solid fa-user"></i>
            </div>
            <h3 id="user-fullname">User Name</h3>
            <p id="user-role" class="user-meta">Role</p>
            <p id="user-position" class="user-meta">Position</p>
            <p id="user-department" class="user-meta">Department</p>
        </div>

        <div class="chat-history-sidebar">
            <button id="new-chat-btn" class="new-chat-btn">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            <h4>Previous Chats</h4>
            <ul class="chat-history-list" id="chat-history-list">
                <!-- Mock chat history items will be injected here -->
            </ul>
        </div>
        <div class="sidebar-footer" style="margin-top: auto; padding: 20px;">
            <button id="logout-btn" class="logout-btn"
                style="width: 100%; padding: 10px; background-color: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                <i class="fa-solid fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>
    <div class="main-content">
        <button id="menu-btn" class="menu-btn">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="container">
            <header class="app-header">
                <h1>Welcome Back!</h1>
                <h2>How can I help you today?</h2>
            </header>
            <div class="chats-container">
                <!-- Chats will appear here -->
            </div>
        </div>
        <div class="prompt-container">
            <div class="prompt-wrapper">
                <div class="file-preview-container" id="file-preview-container"></div>
                <form action="#" placeholder="Enter your prompt here..." class="prompt-form">
                    <input type="file" accept="image/* ,.pdf ,.txt ,.csv" id="file-input" multiple hidden>

                    <input type="text" name="prompt" placeholder="Enter your prompt here..." class="prompt-input"
                        required>

                    <div class="actions">
                        <button id="add-file-button" type="button">
                            <i class="fa-solid fa-paperclip"></i>
                        </button>

                        <button id="send-prompt-button" type="button">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="home_javascript.js"></script>
</body>

</html>
