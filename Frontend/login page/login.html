<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Login Page</title>
</head>
<body>
    <div class="container">
        <div class=" form-box login">
            <form id="login-form">
                <h2>Login</h2>
                <div class="input-box">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="login-password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="forgot_link">
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn login-btn">Login</button>
                <p>or login with the social platforms</p>
                <div class="social_media_icons">
                    <a href="#"><i class='bx bxl-facebook-circle'></i></a>
                    <a href="#"><i class='bx bxl-google' ></i></a>
                    <a href="#"><i class='bx bxl-twitter'></i></a>
                    <a href=""> <i class='bx bxl-github'></i> </a>
                </div>
            </form>
        </div>
         <div class="form-box register">
            <form action="">
                <h2>Registration</h2>
                <div class="input-box">
                    <input type="text" placeholder="Full Name" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">

                </div><div class="input-box">
                    <select required>
                        <option value="" disabled selected>Select Department</option>
                        <option value="finance">Finance</option>
                        <option value="hr">Human Resources</option>
                        <option value="it">IT</option>
                        <option value="marketing">Marketing</option>
                        <option value="operations">Operations</option>
                    </select>
                    <i class='bx bx-chevron-down'></i>
                </div>
                <div class="input-box">
                    <select required>
                        <option value="" disabled selected>Select Role</option>
                        <option value="manager">Manager</option>
                        <option value="assistant">Assistant</option>
                        <option value="executive">Executive</option>
                        <option value="analyst">Analyst</option>
                        <option value="intern">Intern</option>
                    </select>
                    <i class='bx bx-chevron-down'></i>
                </div>


                <div class="input-box">
                    <input type="email" placeholder="Email" required>
                    <i class='bx bxs-envelope' ></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class = "input-box">
                    <input type="password" placeholder="Confirm Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <button type = "submit" class="btn register-btn">Register</button>
                <p>or register with the social platforms</p>
                <div class="social_media_icons">
                    <a href="#"><i class='bx bxl-facebook-circle'></i></a>
                    <a href="#"><i class='bx bxl-google' ></i></a>
                    <a href="#"><i class='bx bxl-twitter'></i></a>
                    <a href=""> <i class='bx bxl-github'></i> </a>
                </div>
            </form>
        </div>
        <div class="toggle-box">
            <div class="toggle-pannel toggle-left">
                <h1>Welcome Back!</h1>
                <p>Don't have an account?</p>
                <button class="button register-button">Register</button>
            </div>
            <div class="toggle-pannel toggle-right">
                <h1>Hello Welcome!</h1>
                <p>Already have an account?</p>
                <button class="button login-button">Login</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
